name: CI

on:
  push:
    branches: [main]
    tags: ['release/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/PentaWork.Tools.PowerPlatform -c Release --no-build -o ./nupkg

      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*.nupkg

  # Only runs for tags matching "release/*" (e.g. "release/1.2.0"), and only after every
  # build-and-test matrix leg (Ubuntu/Windows/macOS) has passed. Publishes via NuGet.org Trusted
  # Publishing (OIDC) - no long-lived API key secret needed. Requires a Trusted Publishing policy
  # configured on nuget.org for this repository + workflow file (ci.yml), and a repository secret
  # named NUGET_USER holding the nuget.org profile name (not email) to authenticate as.
  publish:
    name: Publish to NuGet Gallery
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this job
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./nupkg

      # Exchanges the job's OIDC token for a short-lived (1 hour) NuGet.org API key.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not email address

      - name: Push to NuGet Gallery
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
